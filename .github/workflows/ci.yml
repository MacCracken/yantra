name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Lint
        run: |
          for f in src/*.cyr programs/*.cyr; do
            cyrius lint "$f"
          done

      - name: Format check
        run: |
          for f in src/*.cyr programs/*.cyr; do
            cyrius fmt "$f" --check
          done

      - name: Build smoke
        run: |
          mkdir -p build
          cyrius build programs/smoke.cyr build/yantra-smoke

      - name: Test
        run: cyrius test tests/yantra.tcyr

      - name: Benchmarks
        run: cyrius bench tests/yantra.bcyr

      - name: Bundle library (distlib)
        run: cyrius distlib

      - name: Upload library bundle
        uses: actions/upload-artifact@v4
        with:
          name: yantra-dist
          path: dist/yantra.cyr
          if-no-files-found: error
