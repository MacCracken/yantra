name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Lint
        run: |
          for f in src/*.cyr programs/*.cyr; do
            cyrius lint "$f"
          done

      - name: Format check
        run: |
          for f in src/*.cyr programs/*.cyr; do
            cyrius fmt "$f" --check
          done

      - name: Build smoke
        run: |
          mkdir -p build
          cyrius build programs/smoke.cyr build/yantra-smoke

      - name: Test
        run: cyrius test tests/yantra.tcyr

      - name: Benchmarks
        run: cyrius bench tests/yantra.bcyr

      - name: Bundle library (distlib)
        run: cyrius distlib

      - name: Upload library bundle
        uses: actions/upload-artifact@v4
        with:
          name: yantra-dist
          path: dist/yantra.cyr
          if-no-files-found: error

  e2e-chromium:
    name: E2E (Chromium / CDP)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Launch headless Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          echo "using $CHROME"
          "$CHROME" --headless=new --disable-gpu --no-sandbox \
            --user-data-dir=/tmp/yc-ci --remote-debugging-port=9222 about:blank \
            >/tmp/chromium.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf --max-time 2 http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break
            sleep 0.3
          done
          curl -sf http://127.0.0.1:9222/json/version || { echo "Chromium did not come up"; cat /tmp/chromium.log; exit 1; }

      - name: Run E2E (M1 acceptance)
        run: cyrius test tests/e2e/chromium-smoke.tcyr

  e2e-webdriver:
    name: E2E (WebDriver / chromedriver)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Launch chromedriver
        run: |
          DRIVER="$(command -v chromedriver)"
          if [ -z "$DRIVER" ]; then echo "chromedriver not found on runner"; exit 1; fi
          echo "using $DRIVER"
          "$DRIVER" --port=9515 >/tmp/chromedriver.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf --max-time 2 http://127.0.0.1:9515/status >/dev/null 2>&1 && break
            sleep 0.3
          done
          curl -sf http://127.0.0.1:9515/status || { echo "chromedriver did not come up"; cat /tmp/chromedriver.log; exit 1; }

      - name: Run E2E (M2 acceptance)
        run: cyrius test tests/e2e/webdriver-smoke.tcyr

  e2e-firefox:
    name: E2E (Firefox / geckodriver)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Setup geckodriver
        uses: browser-actions/setup-geckodriver@latest

      - name: Launch geckodriver
        run: |
          geckodriver --port=4444 >/tmp/geckodriver.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf --max-time 2 http://127.0.0.1:4444/status >/dev/null 2>&1 && break
            sleep 0.3
          done
          curl -sf http://127.0.0.1:4444/status || { echo "geckodriver did not come up"; cat /tmp/geckodriver.log; exit 1; }

      - name: Run E2E (Firefox)
        # yantra requests -headless in the firefox caps, so no display needed.
        run: cyrius test tests/e2e/firefox-smoke.tcyr

  e2e-webkit:
    name: E2E (WebKit / WebKitWebDriver)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    # Gating. The caps fix (omit browserName so WebKitGTK's WebKitWebDriver
    # accepts the W3C `alwaysMatch`) held green in CI, so this job now blocks like
    # the other web e2e jobs. (Was non-blocking while that fix was unconfirmed —
    # see architecture 004 for the WebKitGTK browserName-mismatch background.)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Install WebKitGTK driver
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver xvfb

      - name: Launch WebKitWebDriver (headless via Xvfb)
        # WebKitGTK has no headless cap like Chrome/Firefox, so it runs under a
        # virtual display. WEBKIT_DISABLE_COMPOSITING_MODE avoids GPU needs.
        run: |
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          xvfb-run -a WebKitWebDriver --port=4444 --host=127.0.0.1 >/tmp/wkd.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf --max-time 2 http://127.0.0.1:4444/status >/dev/null 2>&1 && break
            sleep 0.3
          done
          curl -sf http://127.0.0.1:4444/status || { echo "WebKitWebDriver did not come up"; cat /tmp/wkd.log; exit 1; }

      - name: Run E2E (WebKit)
        run: cyrius test tests/e2e/webkit-smoke.tcyr

  e2e-android:
    name: E2E (Android / UiAutomator2)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium + UiAutomator2
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run E2E on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          # The emulator-runner executes `script` line-by-line as separate
          # `sh -c`, which kills a backgrounded `appium &` and breaks multi-line
          # loops — so the whole body lives in one helper run as a single line.
          # cyrius is on PATH from setup-cyrius; skipDeviceInitialization in
          # yantra's caps handles the io.appium.settings quirk (architecture 003).
          script: bash scripts/ci/android-e2e.sh

  e2e-ios:
    name: E2E (iOS / XCUITest)
    runs-on: macos-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium + XCUITest + prebuild WDA
        run: |
          npm install -g appium
          appium driver install xcuitest
          # Prebuild/download WebDriverAgent so session-create never runs a cold
          # `xcodebuild` (slow ~4min AND flaky on hosted runners — it intermittently
          # stalls; and yantra's HTTP client struggles with the long silent wait).
          # The session then uses appium:usePreinstalledWDA + the prebuilt .app.
          # Requires iOS 17+/WDA v13+ (we target iOS 18.x). See the
          # appium-xcuitest run-prebuilt-wda guide. Verbose + non-swallowed so a
          # failure is visible (the run step still falls back to building if empty).
          mkdir -p "$HOME/wda"
          echo "::group::download-wda --help"
          appium driver run xcuitest download-wda -- --help 2>&1 || echo "(--help failed: $?)"
          echo "::endgroup::"
          echo "::group::download-wda run"
          appium driver run xcuitest download-wda -- --outdir="$HOME/wda" --kind=sim --platform=ios 2>&1 \
            || echo "download-wda exited non-zero: $?"
          echo "--- recursive listing of $HOME/wda ---"
          ls -laR "$HOME/wda" 2>&1 || true
          echo "--- any .app under it ---"
          find "$HOME/wda" -name '*.app' 2>/dev/null || true
          echo "::endgroup::"

      - name: Boot a simulator + run E2E
        # The committed ios-appium-smoke.tcyr targets the maintainer's local sim
        # (iPhone 17 / iOS 26.5). The hosted runner ships a different Xcode/iOS,
        # so pick a runner sim and run a device-matched copy.
        run: |
          # Match the Xcode and iOS-runtime GENERATION. The macOS runner ships
          # both Xcode 16.4 (default) and Xcode 26.x, plus iOS 18.x AND 26.x
          # runtimes. iOS 26 runtimes are generation-paired with Xcode 26; running
          # them under the default Xcode 16.4 is an unsupported mismatch that
          # yields flaky empty-status boot timeouts ("failed to finish booting
          # after 120s. Original status:") — runner-images #12777/#13317, confirmed
          # by a cited research sweep. So pin Xcode 16.4 and target the newest
          # iOS 18.x runtime (its matched pair), NOT `tail -1` (newest = iOS 26.x).
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version || true
          VER="$(xcrun simctl list runtimes available | grep -Eo 'iOS 18\.[0-9]+' | sed 's/iOS //' | sort -V | tail -1)"
          if [ -z "$VER" ]; then
            echo "No iOS 18.x runtime on this runner; available runtimes:"; xcrun simctl list runtimes available
            exit 1
          fi
          # First available iPhone under that runtime; pin its exact UDID (Appium
          # resolving by name+version could pick a different, un-booted duplicate).
          LINE="$(xcrun simctl list devices available | awk -v ver="-- iOS $VER --" '
            $0==ver {inblk=1; next}
            /^-- / {inblk=0}
            inblk && /^[[:space:]]*iPhone/ { print; exit }')"
          UDID="$(printf '%s' "$LINE" | grep -oiE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)"
          DEV="$(printf '%s' "$LINE" | sed -E 's/^[[:space:]]*//; s/ \(.*$//')"
          if [ -z "$UDID" ]; then
            echo "No iPhone under iOS $VER; devices:"; xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator: $DEV (iOS $VER) UDID=$UDID"
          # Locate the prebuilt WDA .app downloaded in the install step.
          WDA_APP="$(find "$HOME/wda" -name 'WebDriverAgentRunner-Runner.app' -print -quit 2>/dev/null)"
          [ -z "$WDA_APP" ] && WDA_APP="$(find "$HOME/wda" -name '*.app' -print -quit 2>/dev/null)"
          echo "Prebuilt WDA: ${WDA_APP:-<none — session will build WDA via xcodebuild>}"
          # Boot the exact UDID and WAIT for it to be fully booted.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          # log-level debug so a WebDriverAgent / xcodebuild failure shows up in
          # the dumped log on failure (error-level hides the real cause).
          appium --port 4723 --log-level debug >/tmp/appium.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4723/status >/dev/null 2>&1 && break
            sleep 1
          done
          # Rewrite the device/version line for this runner, pin the booted UDID
          # (appium:udid so Appium attaches to the running sim, not a duplicate),
          # and force headless (appium:isHeadless) — the runner has no display,
          # so Appium's default "restart with the Simulator window visible" path
          # hangs in waitForBoot. Anchor on the real call (leading whitespace,
          # not a '#  ...' comment) so the doc-comment example isn't turned into
          # top-level code.
          awk -v dev="$DEV" -v ver="$VER" -v udid="$UDID" -v wda="$WDA_APP" '
            /^[[:space:]]*yantra_mobile_set_ios_device\(/ {
              print "    yantra_mobile_set_ios_device(\"" dev "\", \"" ver "\");"
              if (udid != "") print "    yantra_mobile_set_ios_udid(\"" udid "\");"
              print "    yantra_mobile_set_ios_headless(1);"
              print "    yantra_mobile_set_no_reset(1);"
              if (wda != "") print "    yantra_mobile_set_ios_prebuilt_wda(\"" wda "\");"
              next
            }
            { print }
          ' tests/e2e/ios-appium-smoke.tcyr > /tmp/ios-ci.tcyr
          # Run from repo root so the relative include paths still resolve.
          set +e
          cyrius test /tmp/ios-ci.tcyr
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            # Isolation probe: POST /session via curl with the EXACT caps yantra
            # builds (now incl. appium:udid). curl-creates → yantra transport;
            # curl-also-fails → Appium/WDA/runner env (where this currently sits).
            echo "::group::Direct curl POST /session probe (yantra transport vs Appium/WDA)"
            PREBUILT=""
            [ -n "$WDA_APP" ] && PREBUILT=',"appium:usePreinstalledWDA":true,"appium:prebuiltWDAPath":"'"$WDA_APP"'"'
            CAPS='{"capabilities":{"alwaysMatch":{"platformName":"iOS","appium:automationName":"XCUITest","appium:bundleId":"com.apple.Preferences","appium:deviceName":"'"$DEV"'","appium:platformVersion":"'"$VER"'","appium:udid":"'"$UDID"'","appium:isHeadless":true,"appium:noReset":true,"appium:wdaLaunchTimeout":360000'"$PREBUILT"'}}}'
            echo "caps: $CAPS"
            curl -sS -m 400 -w '\nHTTP %{http_code}\n' -X POST http://127.0.0.1:4723/session \
              -H 'Content-Type: application/json' -d "$CAPS" \
              || echo "curl probe could not connect to Appium"
            echo "::endgroup::"
            echo "::group::Appium log (tail -300)"
            tail -300 /tmp/appium.log || true
            echo "::endgroup::"
            echo "::group::Simulator state"
            xcrun simctl list devices booted || true
            echo "::endgroup::"
          fi
          exit "$rc"

  benchmarks:
    name: Benchmarks (history CSV)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Run micro-benchmarks → CSV
        # Normalized (ns) one-row-per-bench history, AGNOS bench-history shape.
        # Incumbent parity (vs Playwright/Appium) lives in scripts/parity-*.{mjs,py},
        # run manually on a box with the incumbent installed — not in CI.
        run: scripts/bench-history.sh

      - name: Upload bench history
        uses: actions/upload-artifact@v4
        with:
          name: bench-history
          path: bench-history.csv
          if-no-files-found: error
