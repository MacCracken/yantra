name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Lint
        run: |
          for f in src/*.cyr programs/*.cyr; do
            cyrius lint "$f"
          done

      - name: Format check
        run: |
          for f in src/*.cyr programs/*.cyr; do
            cyrius fmt "$f" --check
          done

      - name: Build smoke
        run: |
          mkdir -p build
          cyrius build programs/smoke.cyr build/yantra-smoke

      - name: Test
        run: cyrius test tests/yantra.tcyr

      - name: Benchmarks
        run: cyrius bench tests/yantra.bcyr

      - name: Bundle library (distlib)
        run: cyrius distlib

      - name: Upload library bundle
        uses: actions/upload-artifact@v4
        with:
          name: yantra-dist
          path: dist/yantra.cyr
          if-no-files-found: error

  e2e-chromium:
    name: E2E (Chromium / CDP)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Launch headless Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium)"
          echo "using $CHROME"
          "$CHROME" --headless=new --disable-gpu --no-sandbox \
            --user-data-dir=/tmp/yc-ci --remote-debugging-port=9222 about:blank \
            >/tmp/chromium.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf --max-time 2 http://127.0.0.1:9222/json/version >/dev/null 2>&1 && break
            sleep 0.3
          done
          curl -sf http://127.0.0.1:9222/json/version || { echo "Chromium did not come up"; cat /tmp/chromium.log; exit 1; }

      - name: Run E2E (M1 acceptance)
        run: cyrius test tests/e2e/chromium-smoke.tcyr

  e2e-webdriver:
    name: E2E (WebDriver / chromedriver)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Launch chromedriver
        run: |
          DRIVER="$(command -v chromedriver)"
          if [ -z "$DRIVER" ]; then echo "chromedriver not found on runner"; exit 1; fi
          echo "using $DRIVER"
          "$DRIVER" --port=9515 >/tmp/chromedriver.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf --max-time 2 http://127.0.0.1:9515/status >/dev/null 2>&1 && break
            sleep 0.3
          done
          curl -sf http://127.0.0.1:9515/status || { echo "chromedriver did not come up"; cat /tmp/chromedriver.log; exit 1; }

      - name: Run E2E (M2 acceptance)
        run: cyrius test tests/e2e/webdriver-smoke.tcyr

  e2e-firefox:
    name: E2E (Firefox / geckodriver)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Setup geckodriver
        uses: browser-actions/setup-geckodriver@latest

      - name: Launch geckodriver
        run: |
          geckodriver --port=4444 >/tmp/geckodriver.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf --max-time 2 http://127.0.0.1:4444/status >/dev/null 2>&1 && break
            sleep 0.3
          done
          curl -sf http://127.0.0.1:4444/status || { echo "geckodriver did not come up"; cat /tmp/geckodriver.log; exit 1; }

      - name: Run E2E (Firefox)
        # yantra requests -headless in the firefox caps, so no display needed.
        run: cyrius test tests/e2e/firefox-smoke.tcyr

  e2e-webkit:
    name: E2E (WebKit / WebKitWebDriver)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    # Gating. The caps fix (omit browserName so WebKitGTK's WebKitWebDriver
    # accepts the W3C `alwaysMatch`) held green in CI, so this job now blocks like
    # the other web e2e jobs. (Was non-blocking while that fix was unconfirmed —
    # see architecture 004 for the WebKitGTK browserName-mismatch background.)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Install WebKitGTK driver
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver xvfb

      - name: Launch WebKitWebDriver (headless via Xvfb)
        # WebKitGTK has no headless cap like Chrome/Firefox, so it runs under a
        # virtual display. WEBKIT_DISABLE_COMPOSITING_MODE avoids GPU needs.
        run: |
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          xvfb-run -a WebKitWebDriver --port=4444 --host=127.0.0.1 >/tmp/wkd.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf --max-time 2 http://127.0.0.1:4444/status >/dev/null 2>&1 && break
            sleep 0.3
          done
          curl -sf http://127.0.0.1:4444/status || { echo "WebKitWebDriver did not come up"; cat /tmp/wkd.log; exit 1; }

      - name: Run E2E (WebKit)
        run: cyrius test tests/e2e/webkit-smoke.tcyr

  e2e-android:
    name: E2E (Android / UiAutomator2)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium + UiAutomator2
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run E2E on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          # The emulator-runner executes `script` line-by-line as separate
          # `sh -c`, which kills a backgrounded `appium &` and breaks multi-line
          # loops — so the whole body lives in one helper run as a single line.
          # cyrius is on PATH from setup-cyrius; skipDeviceInitialization in
          # yantra's caps handles the io.appium.settings quirk (architecture 003).
          script: bash scripts/ci/android-e2e.sh

  e2e-ios:
    name: E2E (iOS / XCUITest)
    runs-on: macos-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium + XCUITest
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Boot a simulator + run E2E
        # The committed ios-appium-smoke.tcyr targets the maintainer's local sim
        # (iPhone 17 / iOS 26.5). The hosted runner ships a different Xcode/iOS,
        # so pick whatever sim the runner has and run a device-matched copy.
        run: |
          DEV="$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9]+' | sort -t' ' -k2 -n | tail -1)"
          VER="$(xcrun simctl list runtimes available | grep -Eo 'iOS [0-9]+\.[0-9]+' | tail -1 | awk '{print $2}')"
          echo "Using simulator: $DEV (iOS $VER)"
          # Boot the sim and WAIT for it to be fully booted — the XCUITest
          # session-create builds/launches WebDriverAgent on it, which needs a
          # ready device (and the first build can take a minute+).
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b || true
          # log-level debug so a WebDriverAgent / xcodebuild failure shows up in
          # the dumped log on failure (error-level hides the real cause).
          appium --port 4723 --log-level debug >/tmp/appium.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4723/status >/dev/null 2>&1 && break
            sleep 1
          done
          sed -E "s/yantra_mobile_set_ios_device\\(\"[^\"]*\", \"[^\"]*\"\\)/yantra_mobile_set_ios_device(\"$DEV\", \"$VER\")/" \
            tests/e2e/ios-appium-smoke.tcyr > /tmp/ios-ci.tcyr
          # Run from repo root so the relative include paths still resolve.
          # Capture the exit code so we can surface Appium's log on failure —
          # yantra's session-create error is intentionally generic, the real
          # reason (WDA build, sim mismatch, timeout) lives in the Appium log.
          set +e
          cyrius test /tmp/ios-ci.tcyr
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            # Decisive isolation: POST /session via curl with the EXACT caps
            # yantra builds. If curl creates a session, the bug is yantra's macOS
            # transport (sandhi/net) — the same wd_connect_timeout path passes the
            # Android e2e on Linux. If curl ALSO fails, it's Appium/WDA/runner env.
            echo "::group::Direct curl POST /session probe (yantra transport vs Appium/WDA)"
            CAPS='{"capabilities":{"alwaysMatch":{"platformName":"iOS","appium:automationName":"XCUITest","appium:bundleId":"com.apple.Preferences","appium:deviceName":"'"$DEV"'","appium:platformVersion":"'"$VER"'"}}}'
            echo "caps: $CAPS"
            curl -sS -m 240 -w '\nHTTP %{http_code}\n' -X POST http://127.0.0.1:4723/session \
              -H 'Content-Type: application/json' -d "$CAPS" \
              || echo "curl probe could not connect to Appium"
            echo "::endgroup::"
            echo "::group::Appium log (tail -300)"
            tail -300 /tmp/appium.log || true
            echo "::endgroup::"
            echo "::group::Simulator state"
            xcrun simctl list devices booted || true
            echo "::endgroup::"
          fi
          exit "$rc"

  benchmarks:
    name: Benchmarks (history CSV)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Sync vendored lib
        run: cyrius lib sync

      - name: Run micro-benchmarks → CSV
        # Normalized (ns) one-row-per-bench history, AGNOS bench-history shape.
        # Incumbent parity (vs Playwright/Appium) lives in scripts/parity-*.{mjs,py},
        # run manually on a box with the incumbent installed — not in CI.
        run: scripts/bench-history.sh

      - name: Upload bench history
        uses: actions/upload-artifact@v4
        with:
          name: bench-history
          path: bench-history.csv
          if-no-files-found: error
