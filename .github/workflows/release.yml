name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION="${GITHUB_REF_NAME}"
          test "$FILE_VERSION" = "$TAG_VERSION" || { echo "VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"; exit 1; }

      - name: Setup Cyrius
        uses: ./.github/actions/setup-cyrius

      - name: Build artifacts
        run: |
          mkdir -p build
          # dist/yantra.cyr is the real deliverable — the bundled library
          # downstream `.tcyr` consumers vendor and include.
          cyrius distlib
          # Smoke binary proves the include chain links clean.
          cyrius build programs/smoke.cyr build/yantra-smoke

      - name: Checksums
        run: |
          sha256sum dist/yantra.cyr build/yantra-smoke > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/yantra.cyr
            build/yantra-smoke
            SHA256SUMS
