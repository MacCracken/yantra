name: Setup Cyrius
description: Install and cache the Cyrius toolchain pinned in cyrius.cyml.

inputs:
  version:
    description: "Cyrius version to install. Defaults to the [package].cyrius pin in cyrius.cyml."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve toolchain version
      id: ver
      shell: bash
      run: |
        V="${{ inputs.version }}"
        if [ -z "$V" ]; then
          V="$(grep 'cyrius *= *"' cyrius.cyml | head -1 | sed 's/.*"\(.*\)"/\1/')"
        fi
        if [ -z "$V" ]; then echo "could not resolve Cyrius version"; exit 1; fi
        echo "version=$V" >> "$GITHUB_OUTPUT"
        echo "Cyrius version: $V"

    - name: Cache toolchain
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cyrius
        # Keyed on runner OS+arch so the macOS and Linux caches stay split.
        # The canonical install.sh lays out versions/<v>/{bin,lib} +
        # ~/.cyrius/{bin,lib} symlinks + current.
        key: cyrius-${{ runner.os }}-${{ runner.arch }}-${{ steps.ver.outputs.version }}-v5

    - name: Install toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        V="${{ steps.ver.outputs.version }}"
        # Canonical OS/arch-aware installer (downloads the matching <arch>-<os>
        # tarball, codesigns on macOS, lays out ~/.cyrius). Tolerate a non-zero
        # exit so a partial install is recoverable by the Ensure step below.
        echo "Installing Cyrius $V via the canonical scripts/install.sh"
        curl -sSf "https://raw.githubusercontent.com/MacCracken/cyrius/$V/scripts/install.sh" \
          | CYRIUS_VERSION="$V" sh \
          || echo "::warning::install.sh exited non-zero — Ensure step will complete the layout"

    - name: Ensure toolchain complete
      # ALWAYS runs (NOT gated on cache-hit). The actual root cause of the
      # macos-15-arm64 `cyrius lib sync` failure was NOT missing files — it was
      # an arm64-macOS GETDENTS64 syscall-translation bug (`61` left
      # untranslated → EBADF) so cyrius couldn't *enumerate* a directory that
      # existed. FIXED in the cyrius 6.0.63 binary. This step can't fix that (it
      # uses shell), so it's now (a) a diagnostic dump confirming lib IS present
      # and 6.0.63 reads it, and (b) a generic safety net for missing-files /
      # poisoned-cache cases. Idempotent; no-op on a healthy home. REMOVE after
      # macos-15-arm64 CI confirms green on 6.0.63 (cyrius issue
      # 2026-06-04-macos-install-lib-snapshot-missing-breaks-lib-sync).
      shell: bash
      run: |
        set -euo pipefail
        V="${{ steps.ver.outputs.version }}"
        H="$HOME/.cyrius"; VDIR="$H/versions/$V"; BIN="$VDIR/bin"; LIB="$VDIR/lib"
        A="$(uname -m)"; case "$A" in arm64|aarch64) A=aarch64 ;; x86_64|amd64) A=x86_64 ;; esac
        O="$(uname -s | tr 'A-Z' 'a-z')"; case "$O" in darwin) O=macos ;; linux) O=linux ;; esac
        T="$A-$O"

        echo "::group::~/.cyrius layout (before repair)"
        ls -la "$H" 2>/dev/null || echo "(no ~/.cyrius)"
        ls -la "$VDIR" 2>/dev/null || echo "(no versions/$V)"
        echo "bin files: $(ls -1 "$BIN" 2>/dev/null | wc -l | tr -d ' '), lib .cyr: $(ls -1 "$LIB"/*.cyr 2>/dev/null | wc -l | tr -d ' ')"
        echo "::endgroup::"

        bin_ok() { [ -d "$BIN" ] && [ -n "$(ls -A "$BIN" 2>/dev/null)" ]; }
        lib_ok() { [ -d "$LIB" ] && [ -n "$(ls -A "$LIB" 2>/dev/null)" ]; }

        if ! bin_ok || ! lib_ok; then
          echo "toolchain incomplete (bin_ok=$(bin_ok && echo 1 || echo 0) lib_ok=$(lib_ok && echo 1 || echo 0)) — repairing from the release tarball"
          WORK="$(mktemp -d)"
          curl -sSfL "https://github.com/MacCracken/cyrius/releases/download/$V/cyrius-$V-$T.tar.gz" | tar xz -C "$WORK"
          SRC="$WORK/cyrius-$V-$T"
          if ! bin_ok; then
            mkdir -p "$BIN"; cp -R "$SRC/bin/." "$BIN/"; chmod +x "$BIN"/* 2>/dev/null || true
            # macOS SIGKILLs unsigned cross-built mach-o binaries — ad-hoc sign.
            if [ "$O" = macos ] && command -v codesign >/dev/null 2>&1; then
              for b in "$BIN"/*; do
                [ -f "$b" ] || continue
                head -c4 "$b" | od -An -tx1 | tr -d ' \n' | grep -qiE "cffaedfe|cefaedfe|feedface|feedfacf" \
                  && codesign -s - -f "$b" >/dev/null 2>&1 || true
              done
              echo "ad-hoc codesigned mach-o binaries"
            fi
          fi
          if ! lib_ok; then mkdir -p "$LIB"; cp -R "$SRC/lib/." "$LIB/"; fi
        fi

        # Idempotent finalize: symlinks + current (install.sh may have aborted
        # before doing these).
        ln -sfn "$BIN" "$H/bin"
        ln -sfn "$LIB" "$H/lib"
        [ -f "$H/current" ] || echo "$V" > "$H/current"

        bin_ok || { echo "FATAL: bin still empty after repair"; exit 1; }
        lib_ok || { echo "FATAL: lib still empty after repair"; exit 1; }
        echo "toolchain complete: $(ls -1 "$BIN" | wc -l | tr -d ' ') bin, $(ls -1 "$LIB"/*.cyr 2>/dev/null | wc -l | tr -d ' ') lib .cyr"

    - name: Export PATH and CYRIUS_HOME
      shell: bash
      run: |
        echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
        echo "CYRIUS_HOME=$HOME/.cyrius" >> "$GITHUB_ENV"
