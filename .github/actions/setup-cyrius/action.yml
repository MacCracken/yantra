name: Setup Cyrius
description: Install and cache the Cyrius toolchain pinned in cyrius.cyml.

inputs:
  version:
    description: "Cyrius version to install. Defaults to the [package].cyrius pin in cyrius.cyml."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve toolchain version
      id: ver
      shell: bash
      run: |
        V="${{ inputs.version }}"
        if [ -z "$V" ]; then
          V="$(grep 'cyrius *= *"' cyrius.cyml | head -1 | sed 's/.*"\(.*\)"/\1/')"
        fi
        if [ -z "$V" ]; then echo "could not resolve Cyrius version"; exit 1; fi
        echo "version=$V" >> "$GITHUB_OUTPUT"
        echo "Cyrius version: $V"

    - name: Cache toolchain
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cyrius
        # v2: install into the versioned snapshot layout (versions/<v>/lib)
        # that `cyrius lib sync` and the compiler resolve stdlib from.
        key: cyrius-${{ runner.os }}-${{ steps.ver.outputs.version }}-v2

    - name: Install toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        V="${{ steps.ver.outputs.version }}"
        echo "Installing Cyrius $V"
        curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$V/cyrius-$V-x86_64-linux.tar.gz"
        tar xzf "cyrius-$V-x86_64-linux.tar.gz"
        D="cyrius-$V-x86_64-linux"
        # Lay out the canonical versioned snapshot. `cyrius lib sync` reads
        # ~/.cyrius/versions/<v>/lib, and the compiler resolves stdlib there
        # — the flat ~/.cyrius/{bin,lib} copy was not enough.
        VER="$HOME/.cyrius/versions/$V"
        mkdir -p "$VER"
        cp -r "$D/bin" "$VER/bin"
        cp -r "$D/lib" "$VER/lib"
        chmod +x "$VER/bin/"* 2>/dev/null || true
        # Match the installer's layout: per-version VERSION file + a top-level
        # `current` file holding the active version string (it is a plain file,
        # not a symlink).
        echo "$V" > "$VER/VERSION"
        echo "$V" > "$HOME/.cyrius/current"

    - name: Export PATH and CYRIUS_HOME
      shell: bash
      run: |
        V="${{ steps.ver.outputs.version }}"
        echo "$HOME/.cyrius/versions/$V/bin" >> "$GITHUB_PATH"
        echo "CYRIUS_HOME=$HOME/.cyrius" >> "$GITHUB_ENV"
