name: Setup Cyrius
description: Install and cache the Cyrius toolchain pinned in cyrius.cyml.

inputs:
  version:
    description: "Cyrius version to install. Defaults to the [package].cyrius pin in cyrius.cyml."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve toolchain version
      id: ver
      shell: bash
      run: |
        V="${{ inputs.version }}"
        if [ -z "$V" ]; then
          V="$(grep 'cyrius *= *"' cyrius.cyml | head -1 | sed 's/.*"\(.*\)"/\1/')"
        fi
        if [ -z "$V" ]; then echo "could not resolve Cyrius version"; exit 1; fi
        echo "version=$V" >> "$GITHUB_OUTPUT"
        echo "Cyrius version: $V"

    - name: Cache toolchain
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cyrius
        # Keyed on runner OS+arch so the macOS and Linux caches stay split.
        # The canonical install.sh lays out versions/<v>/{bin,lib} +
        # ~/.cyrius/{bin,lib} symlinks + current.
        key: cyrius-${{ runner.os }}-${{ runner.arch }}-${{ steps.ver.outputs.version }}-v4

    - name: Install toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        V="${{ steps.ver.outputs.version }}"
        # The canonical installer is OS/arch-aware: it detects the platform via
        # uname, downloads the matching <arch>-<os> release tarball, codesigns on
        # macOS, and lays out ~/.cyrius (versions/<v>/{bin,lib} + symlinks +
        # current). The same one-liner the README documents — so the same action
        # serves the Linux (web/Android) and macOS (iOS) jobs unchanged.
        echo "Installing Cyrius $V via the canonical scripts/install.sh"
        curl -sSf "https://raw.githubusercontent.com/MacCracken/cyrius/$V/scripts/install.sh" \
          | CYRIUS_VERSION="$V" sh

    - name: Export PATH and CYRIUS_HOME
      shell: bash
      run: |
        echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
        echo "CYRIUS_HOME=$HOME/.cyrius" >> "$GITHUB_ENV"
